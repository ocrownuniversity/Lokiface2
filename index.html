<!--
  ============================================================================
  SMILETAK — single-file real-time messaging platform
  ============================================================================
  Everything the app needs to RUN lives in this one index.html: React (no
  build step, no JSX — plain React.createElement so it runs directly from a
  <script> tag), Tailwind (CDN), and the Firebase compat SDK.

  TWO THINGS CANNOT LIVE INSIDE THIS FILE, BY PLATFORM DESIGN (not preference):
    1. firestore.rules  — Firestore security rules are not JavaScript, they
       are a separate config artifact deployed straight to Firebase's
       servers via the CLI/console. They cannot be pasted into a webpage.
    2. Background push  — real push-when-the-tab-is-closed requires a
       Service Worker file served at its own URL, which browsers refuse to
       load from inline script. Per your choice, SmileTak skips background
       push entirely: notifications are in-app only (toasts + the bell) and,
       when the tab is open and permission is granted, real OS notifications
       via the Notifications API. This can be upgraded later by dropping in
       a firebase-messaging-sw.js without touching this file's data model.

  AUTH DESIGN NOTE:
  You asked for phone number + password login with securely hashed
  passwords, but no Cloud Functions and everything client-side. Rolling our
  own password hashing in client JS would mean either (a) shipping a bcrypt
  compare that requires reading other users' password hashes from Firestore
  client-side — which defeats security rules entirely — or (b) a Cloud
  Function, which you've ruled out. Instead SmileTak uses Firebase
  Authentication itself (battle-tested hashing, done by Google's servers,
  zero custom crypto in this file) but maps your phone number to a
  synthetic internal email under the hood, e.g. "2348012345678@smiletak.local".
  You never see this — the UI only ever asks for phone + password. This
  keeps request.auth.uid available for real Firestore security rules, keeps
  passwords out of Firestore entirely, and needs zero redesign later: real
  phone OTP can be added as a *linked* credential on top of the same UID.

  FIRESTORE COLLECTIONS:
    users/{uid}                – profile, presence, isAdmin, isSuspended
    usernames/{usernameLower}  – { uid }  (uniqueness reservation)
    phoneIndex/{phoneDigits}   – { uid }  (uniqueness reservation)
    chats/{chatId}             – { members:[uid,uid], lastMessage, lastMessageAt, lastSenderId, typing:{uid:ts} }
    chats/{chatId}/messages/{messageId}
    chatMembers/{chatId_uid}   – per-user chat meta: pinned, archived, muted, unreadCount, lastReadAt, deletedForClear
    statuses/{statusId}        – { uid, type, content/mediaURL, createdAt, expiresAt }
    statuses/{statusId}/views/{viewerUid}
    blockedUsers/{blockerUid_blockedUid}
    reports/{reportId}
    notifications/{uid}/items/{itemId}
    settings/site              – global toggles (admin-editable)

  Fill in YOUR OWN Firebase project config below (create a new, separate
  Firebase project for SmileTak — do not reuse Yeloface's project, per the
  requirement that the two apps stay independent).
  ============================================================================
-->

   SHARED with Yeloface, on your explicit request — same Firebase project

const firebaseConfig = {

const SUPER_ADMIN_EMAIL = 'Zlove@gmail.com';
const SUPER_ADMIN_UID = '9XYqDjiCpDfl3xoNNC3OKBTrxVO2';

/* ============================== HELPERS ============================== */
function normalizePhone(p) { return (p || '').replace(/[^\d+]/g, '').replace(/^00/, '+'); }
function phoneToEmail(p) { return normalizePhone(p).replace(/\D/g, '') + '@smiletak.local'; }
function usernameKey(u) { return (u || '').trim().toLowerCase(); }
function timeAgo(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 10) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return d.toLocaleDateString();
}
function fmtClock(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtDay(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const today = new Date(); const yest = new Date(); yest.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function chatIdFor(a, b) { return [a, b].sort().join('_'); }
function bytesToSize(b) {
  if (!b) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0; let n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}
async function uploadFile(path, file, onProgress) {
  const ref = storage.ref().child(path);
  const task = ref.put(file);
  return new Promise((resolve, reject) => {
    task.on('state_changed',
      snap => onProgress && onProgress(snap.bytesTransferred / snap.totalBytes),
      reject,
      async () => resolve(await task.snapshot.ref.getDownloadURL())
    );
  });
}
function requestNotifyPermission() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
function fireLocalNotification(title, body, icon) {
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      new Notification(title, { body, icon });
    }
  } catch (e) { /* ignore */ }
}

/* ============================== TOAST ============================== */
const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, kind) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, kind: kind || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  return h(ToastCtx.Provider, { value: push },
    children,
    h('div', { className: 'fixed top-3 left-1/2 -translate-x-1/2 z-[999] flex flex-col gap-2 items-center pointer-events-none' },
      toasts.map(t => h('div', {
        key: t.id,
        className: 'fade-in pointer-events-auto px-4 py-2 rounded-full text-sm font-semibold shadow-lg ' +
          (t.kind === 'error' ? 'bg-red-500 text-white' : t.kind === 'success' ? 'bg-brand-600 text-white' : 'bg-ink-800 text-white')
      }, t.msg))
    )
  );
}
function useToast() { return useContext(ToastCtx); }

/* ============================== THEME ============================== */
function useTheme() {
  const [theme, setTheme] = useState(localStorage.getItem('st_theme') || 'light');
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('st_theme', theme);
  }, [theme]);
  return [theme, setTheme];
}
const ThemeCtx = createContext(['light', () => {}]);

/* ============================== AUTH CONTEXT ============================== */
const AuthCtx = createContext(null);
function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => {
      setUser(u);
      if (!u) { setProfile(null); setLoading(false); }
    });
    return unsub;
  }, []);
  useEffect(() => {
    if (!user) return;
    const unsub = db.collection('smiletak_users').doc(user.uid).onSnapshot(async snap => {
      if (!snap.exists && user.uid === SUPER_ADMIN_UID) {
        // First time the shared Yeloface super-admin account logs into SmileTak:
        // auto-provision a minimal SmileTak profile for it, flagged as admin.
        try {
          await db.collection('smiletak_users').doc(user.uid).set({
            fullName: 'Admin',
            username: 'admin',
            usernameDisplay: 'admin',
            phone: '',
            photoURL: null,
            bio: 'SmileTak administrator',
            online: true,
            lastSeen: FieldValue.serverTimestamp(),
            createdAt: FieldValue.serverTimestamp(),
            isAdmin: true,
            isSuspended: false
          }, { merge: true });
        } catch (e) { /* rules will surface any real problem on next attempt */ }
        return; // the set() above re-triggers this onSnapshot with the new doc
      }
      setProfile(snap.exists ? Object.assign({ id: snap.id }, snap.data()) : null);
      setLoading(false);
    });
    return unsub;
  }, [user]);
  // presence
  useEffect(() => {
    if (!user) return;
    db.collection('smiletak_users').doc(user.uid).update({ online: true, lastSeen: FieldValue.serverTimestamp() }).catch(() => {});
    const onVis = () => {
      db.collection('smiletak_users').doc(user.uid).update({
        online: document.visibilityState === 'visible',
        lastSeen: FieldValue.serverTimestamp()
      }).catch(() => {});
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('beforeunload', onVis);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('beforeunload', onVis);
      db.collection('smiletak_users').doc(user.uid).update({ online: false, lastSeen: FieldValue.serverTimestamp() }).catch(() => {});
    };
  }, [user]);
  return h(AuthCtx.Provider, { value: { user, profile, loading } }, children);
}
function useAuth() { return useContext(AuthCtx); }

/* ============================== AVATAR ============================== */
function Avatar({ url, name, size, online }) {
  const s = size || 42;
  return h('div', { className: 'relative shrink-0', style: { width: s, height: s } },
    url
      ? h('img', { src: url, className: 'rounded-full object-cover w-full h-full' })
      : h('div', {
          className: 'rounded-full w-full h-full flex items-center justify-center bg-brand-600 text-white font-bold',
          style: { fontSize: s * 0.38 }
        }, initials(name)),
    online && h('span', { className: 'absolute bottom-0 right-0 w-3 h-3 rounded-full bg-brand-500 border-2 border-white dark:border-ink-900' })
  );
}

/* ============================== AUTH SCREEN ============================== */
function AuthScreen() {
  const toast = useToast();
  const [mode, setMode] = useState('login');
  const [adminMode, setAdminMode] = useState(false);
  const [busy, setBusy] = useState(false);
  const [form, setForm] = useState({ fullName: '', username: '', phone: '', password: '', confirm: '', email: '' });
  const [avatarFile, setAvatarFile] = useState(null);
  const [avatarPreview, setAvatarPreview] = useState(null);
  const set = (k) => (e) => setForm(f => Object.assign({}, f, { [k]: e.target.value }));

  const onPickAvatar = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setAvatarFile(f);
    setAvatarPreview(URL.createObjectURL(f));
  };

  const doLogin = async () => {
    if (adminMode) {
      if (!form.email.trim() || !form.password) return toast('Enter email and password', 'error');
      setBusy(true);
      try {
        await auth.signInWithEmailAndPassword(form.email.trim(), form.password);
      } catch (e) {
        toast(e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password'
          ? 'Incorrect email or password' : (e.message || 'Login failed'), 'error');
      } finally { setBusy(false); }
      return;
    }
    if (!form.phone.trim() || !form.password) return toast('Enter phone and password', 'error');
    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(phoneToEmail(form.phone), form.password);
    } catch (e) {
      toast(e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password'
        ? 'Incorrect phone number or password' : (e.message || 'Login failed'), 'error');
    } finally { setBusy(false); }
  };

  const doRegister = async () => {
    const { fullName, username, phone, password, confirm } = form;
    if (!fullName.trim() || !username.trim() || !phone.trim() || !password) return toast('Please fill in all required fields', 'error');
    if (password.length < 6) return toast('Password must be at least 6 characters', 'error');
    if (password !== confirm) return toast('Passwords do not match', 'error');
    const uKey = usernameKey(username);
    if (!/^[a-z0-9_.]{3,20}$/.test(uKey)) return toast('Username: 3-20 chars, letters/numbers/./_ only', 'error');
    const phoneDigits = normalizePhone(phone);
    if (phoneDigits.replace(/\D/g, '').length < 7) return toast('Enter a valid phone number', 'error');

    setBusy(true);
    try {
      const uSnap = await db.collection('smiletak_usernames').doc(uKey).get();
      if (uSnap.exists) { toast('That username is already taken', 'error'); setBusy(false); return; }
      // Phone uniqueness isn't pre-checked here (smiletak_phoneIndex is
      // intentionally unreadable by anyone, including a not-yet-signed-in
      // user, to keep phone numbers from being enumerable). Firebase Auth
      // itself already guarantees uniqueness, since each phone number maps
      // to one synthetic email — createUserWithEmailAndPassword below will
      // reject with auth/email-already-in-use if that phone is taken, and
      // that's caught in the catch block with a clear message.

      const cred = await auth.createUserWithEmailAndPassword(phoneToEmail(phone), password);
      const uid = cred.user.uid;

      let photoURL = null;
      if (avatarFile) {
        photoURL = await uploadFile('smiletak/avatars/' + uid + '/' + Date.now() + '_' + avatarFile.name, avatarFile);
      }

      const batch = db.batch();
      batch.set(db.collection('smiletak_users').doc(uid), {
        fullName: fullName.trim(),
        username: uKey,
        usernameDisplay: username.trim(),
        phone: phoneDigits,
        photoURL: photoURL || null,
        bio: '',
        online: true,
        lastSeen: FieldValue.serverTimestamp(),
        createdAt: FieldValue.serverTimestamp(),
        isAdmin: uid === SUPER_ADMIN_UID,
        isSuspended: false
      });
      batch.set(db.collection('smiletak_usernames').doc(uKey), { uid });
      batch.set(db.collection('smiletak_phoneIndex').doc(phoneDigits.replace(/\D/g, '')), { uid });
      await batch.commit();
      toast('Welcome to SmileTak!', 'success');
    } catch (e) {
      toast(e.code === 'auth/email-already-in-use' ? 'That phone number is already registered' : (e.message || 'Sign up failed'), 'error');
    } finally { setBusy(false); }
  };

  return h('div', { className: 'h-full w-full flex items-center justify-center bg-gradient-to-br from-brand-600 to-brand-800 p-4' },
    h('div', { className: 'w-full max-w-sm bg-white dark:bg-ink-800 rounded-2xl shadow-xl p-6 fade-in max-h-[92vh] overflow-y-auto no-scrollbar' },
      h('div', { className: 'flex flex-col items-center mb-5' },
        h('div', { className: 'w-14 h-14 rounded-2xl bg-brand-600 text-white flex items-center justify-center font-extrabold text-xl mb-2' }, 'St'),
        h('h1', { className: 'text-xl font-extrabold' }, 'SmileTak'),
        h('p', { className: 'text-xs text-slate-400' }, mode === 'login' ? 'Log in to keep chatting' : 'Create your account')
      ),
      mode === 'register' && h('div', { className: 'flex justify-center mb-4' },
        h('label', { className: 'cursor-pointer' },
          h('input', { type: 'file', accept: 'image/*', className: 'hidden', onChange: onPickAvatar }),
          avatarPreview
            ? h('img', { src: avatarPreview, className: 'w-16 h-16 rounded-full object-cover' })
            : h('div', { className: 'w-16 h-16 rounded-full bg-slate-100 dark:bg-ink-700 flex items-center justify-center text-slate-400' }, h('i', { className: 'fa-solid fa-camera' }))
        )
      ),
      mode === 'register' && h('input', { className: inputCls, placeholder: 'Full name', value: form.fullName, onChange: set('fullName') }),
      mode === 'register' && h('input', { className: inputCls, placeholder: 'Username', value: form.username, onChange: set('username') }),
      mode === 'login' && adminMode
        ? h('input', { className: inputCls, placeholder: 'Admin email', value: form.email, onChange: set('email') })
        : h('input', { className: inputCls, placeholder: 'Phone number (e.g. +2348012345678)', value: form.phone, onChange: set('phone') }),
      h('input', { className: inputCls, type: 'password', placeholder: 'Password', value: form.password, onChange: set('password') }),
      mode === 'register' && h('input', { className: inputCls, type: 'password', placeholder: 'Confirm password', value: form.confirm, onChange: set('confirm') }),
      h('button', {
        disabled: busy,
        onClick: mode === 'login' ? doLogin : doRegister,
        className: 'w-full mt-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white rounded-xl py-2.5 font-semibold flex items-center justify-center gap-2'

/* ============================== CHATS LIST ============================== */
function ChatsListScreen({ onOpenChat, onViewProfile }) {
  const { profile } = useAuth();
  const [memberDocs, setMemberDocs] = useState([]);
  const [chatsMap, setChatsMap] = useState({});
  const [othersMap, setOthersMap] = useState({});
  const [filter, setFilter] = useState('all'); // all | archived
  const [q, setQ] = useState('');
  const toast = useToast();

  useEffect(() => {
    if (!profile) return;
    const unsub = db.collection('smiletak_chatMembers').where('uid', '==', profile.id).onSnapshot(snap => {
      setMemberDocs(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
    });
    return unsub;
  }, [profile]);

  useEffect(() => {
    memberDocs.forEach(m => {
      if (!chatsMap[m.chatId]) {
        db.collection('smiletak_chats').doc(m.chatId).onSnapshot(s => {
          if (s.exists) setChatsMap(prev => Object.assign({}, prev, { [m.chatId]: Object.assign({ id: s.id }, s.data()) }));
        });
      }
    });
    // eslint-disable-next-line
  }, [memberDocs]);

  useEffect(() => {
    Object.values(chatsMap).forEach(c => {
      const otherUid = (c.members || []).find(u => u !== profile.id);
      if (otherUid && !othersMap[otherUid]) {
        db.collection('smiletak_users').doc(otherUid).onSnapshot(s => {
          if (s.exists) setOthersMap(prev => Object.assign({}, prev, { [otherUid]: Object.assign({ id: s.id }, s.data()) }));
        });
      }
    });
    // eslint-disable-next-line
  }, [chatsMap]);

  const rows = memberDocs
    .map(m => {
      const chat = chatsMap[m.chatId];
      if (!chat) return null;
      const otherUid = (chat.members || []).find(u => u !== profile.id);
      const other = othersMap[otherUid];
      return { meta: m, chat, other };
    })
    .filter(Boolean)
    .filter(r => (filter === 'archived' ? r.meta.archived : !r.meta.archived))
    .filter(r => !q.trim() || (r.other && (r.other.fullName || '').toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => {
      if (!!a.meta.pinned !== !!b.meta.pinned) return a.meta.pinned ? -1 : 1;
      const at = a.chat.lastMessageAt ? a.chat.lastMessageAt.toMillis() : 0;
      const bt = b.chat.lastMessageAt ? b.chat.lastMessageAt.toMillis() : 0;
      return bt - at;
    });

  const updateMeta = (chatId, patch) => db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).update(patch).catch(e => toast(e.message, 'error'));

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'px-4 pt-4 pb-2 flex items-center justify-between' },
      h('h1', { className: 'text-xl font-extrabold' }, filter === 'archived' ? 'Archived' : 'SmileTak'),
      filter === 'archived'
        ? h('button', { className: 'text-sm text-brand-600 font-semibold', onClick: () => setFilter('all') }, 'Back')
        : h('button', { className: 'text-sm text-slate-400', onClick: () => setFilter('archived') }, h('i', { className: 'fa-solid fa-box-archive' }))
    ),
    h('div', { className: 'px-4 pb-2' },
      h('div', { className: 'relative' },
        h('i', { className: 'fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs' }),
        h('input', { className: 'w-full pl-9 pr-3 py-2 rounded-full bg-slate-100 dark:bg-ink-700 text-sm focus:outline-none', placeholder: 'Search chats', value: q, onChange: e => setQ(e.target.value) })
      )
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar' },
      rows.length === 0 && h('div', { className: 'text-center text-sm text-slate-400 mt-12' }, filter === 'archived' ? 'No archived chats' : 'No chats yet — tap Discover to find people'),
      rows.map(r => h(ChatRow, {
        key: r.meta.chatId,
        row: r,
        onOpen: () => { onOpenChat({ chatId: r.meta.chatId, other: r.other }); if (r.meta.unreadCount) updateMeta(r.meta.chatId, { unreadCount: 0 }); },
        onPin: () => updateMeta(r.meta.chatId, { pinned: !r.meta.pinned }),
        onMute: () => updateMeta(r.meta.chatId, { muted: !r.meta.muted }),
        onArchive: () => updateMeta(r.meta.chatId, { archived: !r.meta.archived }),
        onProfile: () => r.other && onViewProfile(r.other.id)
      }))
    )
  );
}

    h('div', { onClick: onProfile }, h(Avatar, { url: other && other.photoURL, name: other && other.fullName, online: other && other.online })),
    h('div', { className: 'flex-1 min-w-0', onClick: onOpen },
      h('div', { className: 'flex justify-between items-baseline' },
        h('p', { className: 'font-semibold text-sm truncate' }, (other && other.fullName) || 'Unknown user'),
        h('span', { className: 'text-[11px] text-slate-400 shrink-0 ml-2' }, chat.lastMessageAt ? timeAgo(chat.lastMessageAt) : '')
      ),
      h('div', { className: 'flex justify-between items-center' },
        h('p', { className: 'text-xs text-slate-400 truncate max-w-[70%]' },
          typing ? h('span', { className: 'text-brand-600 font-medium' }, 'typing…') :
          (chat.lastMessage || 'Say hello 👋')),
        !!meta.unreadCount && h('span', { className: 'bg-brand-600 text-white text-[10px] rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1' }, meta.unreadCount)
      )
    ),
    meta.muted && h('i', { className: 'fa-solid fa-volume-xmark text-slate-300 text-xs' }),
    meta.pinned && h('i', { className: 'fa-solid fa-thumbtack text-slate-300 text-xs' }),
    h('div', { className: 'relative' },
      h('button', { onClick: () => setMenuOpen(o => !o), className: 'text-slate-300 px-1' }, h('i', { className: 'fa-solid fa-ellipsis-vertical' })),
      menuOpen && h('div', { className: 'absolute right-0 top-6 z-20 bg-white dark:bg-ink-700 shadow-lg rounded-xl py-1 w-36 text-sm', onMouseLeave: () => setMenuOpen(false) },
        h('button', { className: 'w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { onPin(); setMenuOpen(false); } }, meta.pinned ? 'Unpin' : 'Pin'),
        h('button', { className: 'w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { onMute(); setMenuOpen(false); } }, meta.muted ? 'Unmute' : 'Mute'),
        h('button', { className: 'w-full text-left px-3 py-1.5 hover:bg-slate-50 dark:hover:bg-ink-600', onClick: () => { onArchive(); setMenuOpen(false); } }, meta.archived ? 'Unarchive' : 'Archive')
      )
    )
  );
}

/* ============================== DISCOVER / SEARCH USERS ============================== */
function DiscoverScreen({ onOpenChat, onViewProfile }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const [busy, setBusy] = useState(false);

  const runSearch = async () => {
    const term = q.trim();
    if (!term) { setResults([]); return; }
    setBusy(true);
    try {
      const lower = term.toLowerCase();
      const digits = term.replace(/\D/g, '');
      const queries = [
        db.collection('smiletak_users').orderBy('username').startAt(lower).endAt(lower + '\uf8ff').limit(10).get(),
        db.collection('smiletak_users').orderBy('fullName').startAt(term).endAt(term + '\uf8ff').limit(10).get()
      ];
      if (digits.length >= 4) queries.push(db.collection('smiletak_users').where('phone', '>=', digits).where('phone', '<=', digits + '\uf8ff').limit(10).get());
      const snaps = await Promise.all(queries);
      const map = {};
      snaps.forEach(s => s.docs.forEach(d => { if (d.id !== profile.id) map[d.id] = Object.assign({ id: d.id }, d.data()); }));
      setResults(Object.values(map));
    } catch (e) { toast(e.message, 'error'); }
    setBusy(false);
  };

  const startChat = async (other) => {
    const chatId = chatIdFor(profile.id, other.id);
    const blocked = await db.collection('smiletak_blockedUsers').doc(other.id + '_' + profile.id).get();
    if (blocked.exists) return toast("You can't message this user", 'error');
    const chatRef = db.collection('smiletak_chats').doc(chatId);
    const snap = await chatRef.get();
    if (!snap.exists) {
      const batch = db.batch();
      batch.set(chatRef, { members: [profile.id, other.id], createdAt: FieldValue.serverTimestamp(), lastMessage: '', lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: null, typing: {} });
      batch.set(db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id), { chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() });
      batch.set(db.collection('smiletak_chatMembers').doc(chatId + '_' + other.id), { chatId, uid: other.id, pinned: false, archived: false, muted: false, unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() });
      await batch.commit();
    }
    onOpenChat({ chatId, other });
  };

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'px-4 pt-4 pb-2' }, h('h1', { className: 'text-xl font-extrabold' }, 'Discover people')),
    h('div', { className: 'px-4 pb-2 flex gap-2' },
      h('input', {
        className: 'flex-1 px-3 py-2 rounded-full bg-slate-100 dark:bg-ink-700 text-sm focus:outline-none',
        placeholder: 'Search by username, name, or phone',
        value: q, onChange: e => setQ(e.target.value), onKeyDown: e => e.key === 'Enter' && runSearch()
      }),
      h('button', { className: 'px-4 rounded-full bg-brand-600 text-white text-sm font-semibold', onClick: runSearch }, busy ? '…' : 'Go')
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar px-2' },
      results.length === 0 && h('p', { className: 'text-center text-sm text-slate-400 mt-10' }, 'Search for someone to start chatting'),
      results.map(u => h('div', { key: u.id, className: 'flex items-center gap-3 px-2 py-2.5 hover:bg-slate-50 dark:hover:bg-ink-800 rounded-xl' },
        h('div', { onClick: () => onViewProfile(u.id), className: 'cursor-pointer' }, h(Avatar, { url: u.photoURL, name: u.fullName, online: u.online })),
        h('div', { className: 'flex-1 min-w-0 cursor-pointer', onClick: () => onViewProfile(u.id) },
          h('p', { className: 'font-semibold text-sm' }, u.fullName),
          h('p', { className: 'text-xs text-slate-400' }, '@' + u.username)
        ),
        h('button', { className: 'text-brand-600 px-3 py-1.5 rounded-full border border-brand-600 text-xs font-semibold', onClick: () => startChat(u) }, 'Message')
      ))
    )
  );
}

/* ============================== CHAT WINDOW ============================== */
function ChatWindow({ chatId, other, onBack, onViewProfile }) {
  const { profile } = useAuth();
  const toast = useToast();
  const [messages, setMessages] = useState([]);
  const [chat, setChat] = useState(null);
  const [otherLive, setOtherLive] = useState(other);
  const [text, setText] = useState('');
  const [replyTo, setReplyTo] = useState(null);
  const [search, setSearch] = useState(null);
  const [menuMsg, setMenuMsg] = useState(null);
  const [forwardMsg, setForwardMsg] = useState(null);
  const [recording, setRecording] = useState(false);
  const [uploadPct, setUploadPct] = useState(null);
  const bottomRef = useRef(null);
  const fileRef = useRef(null);
  const typingTimeout = useRef(null);
  const mediaRecorder = useRef(null);
  const audioChunks = useRef([]);

  useEffect(() => {
    const unsub = db.collection('smiletak_chats').doc(chatId).onSnapshot(s => setChat(s.exists ? s.data() : null));
    return unsub;
  }, [chatId]);

  useEffect(() => {
    const unsub = db.collection('smiletak_users').doc(other.id).onSnapshot(s => s.exists && setOtherLive(Object.assign({ id: s.id }, s.data())));
    return unsub;
  }, [other.id]);

  useEffect(() => {
    const unsub = db.collection('smiletak_chats').doc(chatId).collection('messages').orderBy('createdAt', 'asc').limit(500)
      .onSnapshot(snap => {
        const msgs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        setMessages(msgs);
        // mark delivered + read for messages from the other person
        const batch = db.batch();
        let any = false;
        snap.docs.forEach(d => {
          const m = d.data();
          if (m.senderId !== profile.id) {
            if (!(m.deliveredTo || []).includes(profile.id)) { batch.update(d.ref, { deliveredTo: FieldValue.arrayUnion(profile.id) }); any = true; }
            if (!(m.readBy || []).includes(profile.id)) { batch.update(d.ref, { readBy: FieldValue.arrayUnion(profile.id) }); any = true; }
          }
        });
        if (any) batch.commit().catch(() => {});
      });
    return unsub;
  }, [chatId, profile.id]);

  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ behavior: 'smooth' }); }, [messages.length]);

  useEffect(() => {
    db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id).update({ unreadCount: 0, lastReadAt: FieldValue.serverTimestamp() }).catch(() => {});
  }, [chatId, messages.length]);

  const setTyping = (isTyping) => {
    db.collection('smiletak_chats').doc(chatId).update({ ['typing.' + profile.id]: isTyping ? FieldValue.serverTimestamp() : null }).catch(() => {});
  };
  const onTextChange = (e) => {
    setText(e.target.value);
    setTyping(true);
    clearTimeout(typingTimeout.current);
    typingTimeout.current = setTimeout(() => setTyping(false), 2500);
  };

  const sendMessage = async (payload) => {
    const base = { senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false };
    if (replyTo) base.replyTo = { id: replyTo.id, senderId: replyTo.senderId, snippet: (replyTo.text || (replyTo.type + ' message')).slice(0, 80) };
    await db.collection('smiletak_chats').doc(chatId).collection('messages').add(Object.assign(base, payload));
    const preview = payload.type === 'text' ? payload.text : ('📎 ' + payload.type);
    await db.collection('smiletak_chats').doc(chatId).set({ lastMessage: preview.slice(0, 100), lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
    await db.collection('smiletak_chatMembers').doc(chatId + '_' + other.id).set({ unreadCount: FieldValue.increment(1) }, { merge: true });
    fireLocalNotification(profile.fullName, preview, profile.photoURL);
    setReplyTo(null);
    setText('');
    setTyping(false);
  };

  const onSend = () => {
    const t = text.trim();
    if (!t) return;
    sendMessage({ type: 'text', text: t });
  };

  const onPickFile = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    fileRef.current.value = '';
    let type = 'document';
    if (f.type.startsWith('image/')) type = 'image';
    else if (f.type.startsWith('video/')) type = 'video';
    else if (f.type.startsWith('audio/')) type = 'audio';
    try {
      setUploadPct(0);
      const url = await uploadFile('smiletak/chatMedia/' + chatId + '/' + Date.now() + '_' + f.name, f, p => setUploadPct(p));
      await sendMessage({ type, mediaURL: url, mediaName: f.name, mediaSize: f.size, text: '' });
    } catch (err) { toast('Upload failed: ' + err.message, 'error'); }
    setUploadPct(null);
  };

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(stream);
      mediaRecorder.current = rec;
      audioChunks.current = [];
      rec.ondataavailable = e => audioChunks.current.push(e.data);
      rec.onstop = async () => {
        const blob = new Blob(audioChunks.current, { type: 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        setUploadPct(0);
        try {
          const url = await uploadFile('smiletak/voiceNotes/' + chatId + '/' + Date.now() + '.webm', blob, p => setUploadPct(p));
          await sendMessage({ type: 'voice', mediaURL: url, text: '' });
        } catch (err) { toast('Voice note failed: ' + err.message, 'error'); }
        setUploadPct(null);
      };
      rec.start();
      setRecording(true);
    } catch (e) { toast('Microphone permission denied', 'error'); }
  };
  const stopRecording = () => { mediaRecorder.current && mediaRecorder.current.stop(); setRecording(false); };

  const deleteForMe = (m) => db.collection('smiletak_chats').doc(chatId).collection('messages').doc(m.id).update({ deletedFor: FieldValue.arrayUnion(profile.id) });
  const deleteForEveryone = (m) => db.collection('smiletak_chats').doc(chatId).collection('messages').doc(m.id).update({ deletedForEveryone: true, text: '', mediaURL: null });
  const copyText = (m) => { navigator.clipboard.writeText(m.text || ''); toast('Copied', 'success'); };
  const doForward = async (targetChatId, targetOtherId) => {
    await db.collection('smiletak_chats').doc(targetChatId).collection('messages').add({
      senderId: profile.id, createdAt: FieldValue.serverTimestamp(), readBy: [], deliveredTo: [], deletedFor: [], deletedForEveryone: false,
      type: forwardMsg.type, text: forwardMsg.text || '', mediaURL: forwardMsg.mediaURL || null, mediaName: forwardMsg.mediaName || null, forwarded: true
    });
    await db.collection('smiletak_chats').doc(targetChatId).set({ lastMessage: '↪ forwarded message', lastMessageAt: FieldValue.serverTimestamp(), lastSenderId: profile.id }, { merge: true });
    await db.collection('smiletak_chatMembers').doc(targetChatId + '_' + targetOtherId).set({ unreadCount: FieldValue.increment(1) }, { merge: true });
    toast('Forwarded', 'success');
    setForwardMsg(null);
  };

  const visible = messages.filter(m => !(m.deletedFor || []).includes(profile.id))
    .filter(m => !search || (m.text || '').toLowerCase().includes(search.toLowerCase()));

  const typingNow = chat && chat.typing && chat.typing[other.id] &&
    (Date.now() - (chat.typing[other.id].toMillis ? chat.typing[other.id].toMillis() : 0) < 5000);

  let lastDay = null;

  return h('div', { className: 'h-full flex flex-col bg-slate-50 dark:bg-ink-900' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 bg-white dark:bg-ink-800 border-b border-slate-200 dark:border-ink-700 shrink-0' },
      h('button', { onClick: onBack, className: 'text-slate-500 px-1' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('div', { className: 'cursor-pointer flex items-center gap-2 flex-1 min-w-0', onClick: () => onViewProfile(other.id) },
        h(Avatar, { url: otherLive.photoURL, name: otherLive.fullName, size: 36, online: otherLive.online }),
        h('div', { className: 'min-w-0' },
          h('p', { className: 'font-semibold text-sm truncate' }, otherLive.fullName),
          h('p', { className: 'text-[11px] text-slate-400' }, typingNow ? h('span', { className: 'text-brand-600' }, 'typing…') : (otherLive.online ? 'Online' : otherLive.lastSeen ? 'last seen ' + timeAgo(otherLive.lastSeen) : ''))
        )
      ),
      h('button', { className: 'text-slate-400 px-1', onClick: () => setSearch(search === null ? '' : null) }, h('i', { className: 'fa-solid fa-magnifying-glass' }))
    ),
    search !== null && h('div', { className: 'px-3 py-2 bg-white dark:bg-ink-800 border-b border-slate-100 dark:border-ink-700' },
      h('input', { autoFocus: true, className: 'w-full px-3 py-1.5 rounded-full bg-slate-100 dark:bg-ink-700 text-sm focus:outline-none', placeholder: 'Search in this chat', value: search, onChange: e => setSearch(e.target.value) })

  const [blocked, setBlocked] = useState(false);
  const [reporting, setReporting] = useState(false);

  useEffect(() => { const unsub = db.collection('smiletak_users').doc(uid).onSnapshot(s => setUser(s.exists ? Object.assign({ id: s.id }, s.data()) : null)); return unsub; }, [uid]);
  useEffect(() => { db.collection('smiletak_blockedUsers').doc(profile.id + '_' + uid).get().then(s => setBlocked(s.exists)); }, [uid, profile.id]);

  if (!user) return h('div', { className: 'p-6 text-center text-sm text-slate-400' }, 'Loading…');

  const toggleBlock = async () => {
    if (blocked) { await db.collection('smiletak_blockedUsers').doc(profile.id + '_' + uid).delete(); setBlocked(false); toast('Unblocked', 'success'); }
    else { await db.collection('smiletak_blockedUsers').doc(profile.id + '_' + uid).set({ blockerUid: profile.id, blockedUid: uid, createdAt: FieldValue.serverTimestamp() }); setBlocked(true); toast('User blocked', 'success'); }
  };
  const submitReport = async (reason) => {
    await db.collection('smiletak_reports').add({ reporterUid: profile.id, reportedUid: uid, reason, status: 'pending', createdAt: FieldValue.serverTimestamp() });
    toast('Report submitted', 'success');
    setReporting(false);
  };
  const message = async () => {
    const chatId = chatIdFor(profile.id, uid);
    const snap = await db.collection('smiletak_chats').doc(chatId).get();
    if (!snap.exists) {
      const batch = db.batch();
      batch.set(db.collection('smiletak_chats').doc(chatId), { members: [profile.id, uid], createdAt: FieldValue.serverTimestamp(), lastMessage: '', lastMessageAt: FieldValue.serverTimestamp(), typing: {} });
      batch.set(db.collection('smiletak_chatMembers').doc(chatId + '_' + profile.id), { chatId, uid: profile.id, pinned: false, archived: false, muted: false, unreadCount: 0 });
      batch.set(db.collection('smiletak_chatMembers').doc(chatId + '_' + uid), { chatId, uid, pinned: false, archived: false, muted: false, unreadCount: 0 });
      await batch.commit();
    }
    onMessage(chatId, user);
  };

  return h('div', { className: 'h-full overflow-y-auto no-scrollbar' },
    h('div', { className: 'flex items-center gap-3 px-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
      h('button', { onClick: onBack, className: 'text-slate-500' }, h('i', { className: 'fa-solid fa-arrow-left' })),
      h('p', { className: 'font-semibold' }, 'Profile')
    ),
    h('div', { className: 'flex flex-col items-center py-6' },
      h(Avatar, { url: user.photoURL, name: user.fullName, size: 96, online: user.online }),
      h('h2', { className: 'font-extrabold text-lg mt-3' }, user.fullName),
      h('p', { className: 'text-sm text-slate-400' }, '@' + user.username),
      h('p', { className: 'text-xs text-slate-400 mt-1' }, user.online ? 'Online' : user.lastSeen ? 'Last seen ' + timeAgo(user.lastSeen) : '')
    ),
    h('div', { className: 'px-4' },
      h(FieldBlock, { label: 'Bio', value: user.bio || 'No bio yet' }),
      h(FieldBlock, { label: 'Phone number', value: '+' + user.phone })
    ),
    h('div', { className: 'px-4 mt-6 space-y-2 pb-8' },
      h('button', { onClick: message, className: 'w-full bg-brand-600 text-white rounded-xl py-2.5 font-semibold text-sm' }, h('i', { className: 'fa-solid fa-message mr-2' }), 'Message'),
      h('button', { onClick: toggleBlock, className: 'w-full border border-slate-200 dark:border-ink-600 rounded-xl py-2.5 font-semibold text-sm' }, blocked ? 'Unblock user' : 'Block user'),
      h('button', { onClick: () => setReporting(true), className: 'w-full border border-red-200 text-red-500 rounded-xl py-2.5 font-semibold text-sm' }, 'Report user')
    ),
    reporting && h('div', { className: 'fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4', onClick: () => setReporting(false) },
      h('div', { className: 'bg-white dark:bg-ink-800 rounded-2xl p-4 w-full max-w-sm', onClick: e => e.stopPropagation() },
        h('p', { className: 'font-semibold mb-3' }, 'Report this user'),
        ['Spam', 'Harassment', 'Inappropriate content', 'Impersonation', 'Other'].map(r => h('button', { key: r, className: 'w-full text-left px-3 py-2 rounded-lg hover:bg-slate-50 dark:hover:bg-ink-700 text-sm', onClick: () => submitReport(r) }, r))
      )
    )
  );
}

/* ============================== ADMIN PANEL ============================== */
function AdminPanel() {
  const { profile } = useAuth();
  const toast = useToast();
  const [tab, setTab] = useState('dashboard');
  const [stats, setStats] = useState({ users: null, online: null, reports: null, suspended: null });
  const [users, setUsers] = useState([]);
  const [reports, setReports] = useState([]);
  const [search, setSearch] = useState('');

  useEffect(() => {
    db.collection('smiletak_users').get().then(s => setStats(st => Object.assign({}, st, { users: s.size, online: s.docs.filter(d => d.data().online).length, suspended: s.docs.filter(d => d.data().isSuspended).length })));
    db.collection('smiletak_reports').where('status', '==', 'pending').get().then(s => setStats(st => Object.assign({}, st, { reports: s.size })));
  }, []);

  useEffect(() => {
    if (tab !== 'users') return;
    const unsub = db.collection('smiletak_users').orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setUsers(s.docs.map(d => Object.assign({ id: d.id }, d.data()))));
    return unsub;
  }, [tab]);

  useEffect(() => {
    if (tab !== 'reports') return;
    const unsub = db.collection('smiletak_reports').orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setReports(s.docs.map(d => Object.assign({ id: d.id }, d.data()))));
    return unsub;
  }, [tab]);

  const toggleSuspend = (u) => db.collection('smiletak_users').doc(u.id).update({ isSuspended: !u.isSuspended }).then(() => toast(u.isSuspended ? 'Unsuspended' : 'Suspended', 'success'));
  const toggleAdmin = (u) => db.collection('smiletak_users').doc(u.id).update({ isAdmin: !u.isAdmin }).then(() => toast('Updated', 'success'));
  const resolveReport = (r) => db.collection('smiletak_reports').doc(r.id).update({ status: 'resolved' });

  const filteredUsers = users.filter(u => !search || (u.fullName || '').toLowerCase().includes(search.toLowerCase()) || (u.username || '').includes(search.toLowerCase()) || (u.phone || '').includes(search));

  return h('div', { className: 'h-full flex flex-col' },
    h('div', { className: 'px-4 pt-4 pb-2' }, h('h1', { className: 'text-xl font-extrabold' }, 'Admin Panel')),
    h('div', { className: 'flex gap-1 px-4 pb-2 overflow-x-auto no-scrollbar' },
      ['dashboard', 'users', 'reports'].map(t => h('button', { key: t, onClick: () => setTab(t), className: 'px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ' + (tab === t ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-ink-700') }, t[0].toUpperCase() + t.slice(1)))
    ),
    h('div', { className: 'flex-1 overflow-y-auto no-scrollbar px-4 pb-6' },
      tab === 'dashboard' && h('div', { className: 'grid grid-cols-2 gap-3' },
        h(StatCard, { label: 'Total users', value: stats.users }),
        h(StatCard, { label: 'Online now', value: stats.online }),
        h(StatCard, { label: 'Pending reports', value: stats.reports }),
        h(StatCard, { label: 'Suspended', value: stats.suspended })
      ),
      tab === 'users' && h('div', null,
        h('input', { className: inputCls, placeholder: 'Search users…', value: search, onChange: e => setSearch(e.target.value) }),
        filteredUsers.map(u => h('div', { key: u.id, className: 'flex items-center gap-3 py-2.5 border-b border-slate-100 dark:border-ink-800' },
          h(Avatar, { url: u.photoURL, name: u.fullName, size: 36 }),
          h('div', { className: 'flex-1 min-w-0' }, h('p', { className: 'text-sm font-semibold truncate' }, u.fullName, u.isAdmin && h('span', { className: 'ml-1 text-[10px] bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded-full' }, 'admin'), u.isSuspended && h('span', { className: 'ml-1 text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full' }, 'suspended')),
            h('p', { className: 'text-xs text-slate-400' }, '@' + u.username, ' · +', u.phone)),
          h('div', { className: 'flex gap-1' },
            h('button', { className: 'text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-ink-600', onClick: () => toggleSuspend(u) }, u.isSuspended ? 'Unsuspend' : 'Suspend'),
            h('button', { className: 'text-xs px-2 py-1 rounded-lg border border-slate-200 dark:border-ink-600', onClick: () => toggleAdmin(u) }, u.isAdmin ? 'Revoke admin' : 'Make admin')
          )
        ))
      ),
      tab === 'reports' && h('div', null,
        reports.length === 0 && h('p', { className: 'text-sm text-slate-400 mt-4' }, 'No reports'),
        reports.map(r => h('div', { key: r.id, className: 'py-2.5 border-b border-slate-100 dark:border-ink-800' },
          h('p', { className: 'text-sm font-semibold' }, r.reason, r.status === 'resolved' && h('span', { className: 'ml-2 text-[10px] text-brand-600' }, 'resolved')),
          h('p', { className: 'text-xs text-slate-400' }, 'Reported user: ', r.reportedUid, ' · ', timeAgo(r.createdAt)),
          r.status === 'pending' && h('button', { className: 'text-xs text-brand-600 font-semibold mt-1', onClick: () => resolveReport(r) }, 'Mark resolved')
        ))
      )
    )
  );
}
function StatCard({ label, value }) {
  return h('div', { className: 'bg-white dark:bg-ink-800 rounded-2xl p-4 shadow-sm' },
    h('p', { className: 'text-2xl font-extrabold' }, value === null ? '—' : value),
    h('p', { className: 'text-xs text-slate-400 mt-1' }, label)
  );
}

/* ============================== ROOT ============================== */
function Root() {
  const themeState = useTheme();
  const { user, profile, loading } = useAuth();
  if (loading) {
    return h('div', { className: 'h-full flex items-center justify-center' }, h('div', { className: 'w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full spinner' }));
  }
  return h(ThemeCtx.Provider, { value: themeState },
    !user || !profile ? h(AuthScreen, null) : h(AppShell, null)
  );
}
function App() {
  return h(ToastProvider, null, h(AuthProvider, null, h(Root, null)));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
} catch (e) {
  document.getElementById('root').innerHTML =
    '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0f16;color:#fff;padding:24px;text-align:center;font-family:sans-serif;">' +
    '<div style="font-size:32px;">⚠️</div>' +
    '<div style="font-weight:700;font-size:16px;">SmileTak failed to start</div>' +
    '<div style="font-size:13px;opacity:.7;max-width:320px;">' + (e && e.message ? e.message : 'Unknown error') + '</div>' +
    '<button onclick="location.reload()" style="background:#00A884;color:#fff;border:none;padding:10px 22px;border-radius:999px;font-weight:600;font-size:14px;">Retry</button>' +
    '</div>';
}

</script>
</body>
</html>
